<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>TT Universe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>TT Universe</h1>

    <div class="level-info">
        <h2 id="levelName">Poziom 0</h2>
        <p id="objective"></p>
    </div>

    <div class="expression">
        <span id="expression">TT</span>
    </div>

    <div id="letters" class="letters">

    </div>

    <div class="buttons">
        <button id="undo">← Cofnij</button>
        <button id="check">Sprawdź</button>
        <button id="next" disabled>Następny poziom</button>
    </div>

    <div id="message"></div>

</div>

<script src="levels.js"></script>
<script src="script.js"></script>

</body>
</html>
