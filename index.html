<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Kurpinatoryka</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="startScreen">

    <h1>Tata Tomka</h1>

    <p>
        To złoty człowiek, który zawsze służy pomocą.
    </p>

    <p>
        Widząc inicjały TT, od razu wiadomo, o kogo chodzi.
        Czy to oznacza, że Tomek to STT? (Syn Taty Tomka)
    </p>

    <p>
        Możemy spóbowac pójść w to głębiej...
    </p>

    <button id="startButton">
        Rozpocznij
    </button>

</div>
<div class="container" id="game" style="display:none;">

    <h1>Kurpinatoryka</h1>

    <div class="level-info">
        <h2 id="levelName">Poziom 0</h2>
        <p id="objective"></p>
    </div>

    <div class="expression">
        <span id="expression"></span>
    </div>

    <div id="letters" class="letters">

    </div>

    <div class="buttons">
        <button id="undo">← Cofnij</button>
        <button id="check">Sprawdź</button>
        <button id="next" disabled>Następny poziom</button>
    </div>

    <div id="message"></div>

</div>

<script src="levels.js"></script>
<script src="script.js"></script>

</body>
</html>
